<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="30%" stop-color="#F1C40F" />
      <stop offset="70%" stop-color="#D4AC0D" />
      <stop offset="100%" stop-color="#8A5E0B" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F1C40F" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="glassShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#00B8D9" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Outer ambient ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.25" />

  <!-- ==================== MAIN GOLDEN LOGO ICON ==================== -->
  <g transform="translate(0, 0)">
    <!-- 1. LEFT DOOR LEG OF "A" -->
    <!-- Door Outer Pillar Frame -->
    <path d="M 150 70 L 235 30 L 235 280 L 150 280 Z" fill="url(#goldGrad)" stroke="#5D4037" stroke-width="1" />
    <path d="M 150 70 L 175 80 L 175 270 L 150 280 Z" fill="url(#goldLight)" />

    <!-- Open Door Panel in 3D Perspective -->
    <path d="M 175 80 L 225 105 L 225 255 L 175 270 Z" fill="url(#goldGrad)" />
    <!-- Door Panel Recessed Inset -->
    <path d="M 183 95 L 217 112 L 217 247 L 183 257 Z" fill="#6B4706" />
    <path d="M 185 98 L 215 113 L 215 245 L 185 255 Z" fill="url(#goldGrad)" />
    <!-- Door Handle Bar -->
    <rect x="208" y="165" width="4" height="28" rx="2" fill="#FFFFFF" />
    <circle cx="210" cy="179" r="3" fill="url(#goldGrad)" />

    <!-- 2. RIGHT WINDOW LEG OF "A" -->
    <!-- Window Frame Structure -->
    <path d="M 275 110 L 362 110 L 362 280 L 275 280 Z" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linejoin="round" />
    
    <!-- 4 Glass Panes Grid -->
    <rect x="284" y="119" width="33" height="68" fill="url(#glassShade)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <rect x="320" y="119" width="33" height="68" fill="url(#glassShade)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <rect x="284" y="193" width="33" height="78" fill="url(#glassShade)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <rect x="320" y="193" width="33" height="78" fill="url(#glassShade)" stroke="url(#goldGrad)" stroke-width="2.5" />

    <!-- 3. TOP APEX ARCH & CROSSBAR -->
    <path d="M 215 35 L 256 12 L 297 35 L 265 65 Z" fill="url(#goldGrad)" />
    <!-- Golden Center Cross Bar Connecting Door & Window -->
    <path d="M 195 190 L 330 190 L 330 212 L 195 212 Z" fill="url(#goldGrad)" stroke="#5D4037" stroke-width="1" />
  </g>

  <!-- ==================== BRANDING TYPOGRAPHY ==================== -->
  <!-- "AJANTA" -->
  <text x="256" y="360" text-anchor="middle" font-family="serif" font-weight="900" font-size="52" letter-spacing="8" fill="url(#goldGrad)">AJANTA</text>

  <!-- Accent Divider Lines -->
  <line x1="50" y1="392" x2="135" y2="392" stroke="url(#goldGrad)" stroke-width="2" />
  <line x1="377" y1="392" x2="462" y2="392" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- "DOOR & WINDOW SYSTEMS" -->
  <text x="256" y="398" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="14" letter-spacing="3" fill="url(#goldGrad)">DOOR &amp; WINDOW SYSTEMS</text>

  <!-- Subtext -->
  <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" letter-spacing="4" fill="#00B8D9" opacity="0.9">SINCE 1976 • PREMIUM GLAZING</text>
</svg>